services:
  postgres:
    image: postgres:17-alpine
    container_name: isolator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: isolator
      POSTGRES_PASSWORD: isolator
      POSTGRES_DB: isolator
    ports:
      # 5440 on the host to avoid clashing with other local Postgres instances.
      - "5440:5432"
    volumes:
      - isolator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isolator -d isolator"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: a local S3 API, to try the S3 file storage. `docker compose --profile s3 up -d minio`
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: isolator-minio
    profiles: [s3]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: isolator
      MINIO_ROOT_PASSWORD: isolator-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - isolator_minio:/data

  # Optional: virus scanning for uploads. `docker compose --profile clamav up -d clamav`
  clamav:
    image: clamav/clamav:1.4
    # Only published for amd64. Apple Silicon runs it under emulation.
    platform: linux/amd64
    container_name: isolator-clamav
    profiles: [clamav]
    ports:
      - "3310:3310"

volumes:
  isolator_pgdata:
  isolator_minio:
